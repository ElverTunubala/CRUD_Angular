<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Product List</h2>
      <button *ngIf="authService.isAdmin()" class="btn btn-primary" routerLink="/products/new">
        Add Product
      </button>
    </div>
  
    <div *ngIf="isLoading" class="text-center">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  
    <div *ngIf="!isLoading && products.length === 0" class="alert alert-info">
      No products found.
    </div>
  
    <div class="row row-cols-1 row-cols-md-3 g-4">
      <div class="col" *ngFor="let product of products">
        <div class="card h-100" appHighlight>
          <img [src]="product.image || 'https://via.placeholder.com/300'" class="card-img-top" alt="{{product.name}}">
          <div class="card-body">
            <h5 class="card-title">{{ product.name }}</h5>
            <p class="card-text">{{ product.description }}</p>
            <p class="card-text"><strong>Price:</strong> {{ product.price | appCurrency:'USD' }}</p>
            <p class="card-text"><strong>Stock:</strong> {{ product.stock }}</p>
          </div>
          <div class="card-footer">
            <a [routerLink]="['/products', product.id]" class="btn btn-info btn-sm me-2">View</a>
            <a *ngIf="authService.isAdmin()" [routerLink]="['/products', product.id, 'edit']" class="btn btn-warning btn-sm me-2">Edit</a>
            <button *ngIf="authService.isAdmin()" (click)="deleteProduct(product.id)" class="btn btn-danger btn-sm">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>
