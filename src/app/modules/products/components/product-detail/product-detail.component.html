<div class="container mt-4">
  <!-- Spinner -->
  <div *ngIf="isLoading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Producto -->
  <div *ngIf="!isLoading && product" class="card">
    <div class="row g-0">
      <div class="col-md-4">
        <img 
          [src]="product.image || 'https://via.placeholder.com/300'" 
          class="img-fluid rounded-start" 
          [alt]="product.name || 'No name'">
      </div>
      <div class="col-md-8">
        <div class="card-body">
          <h2 class="card-title">{{ product.name }}</h2>
          <p class="card-text">{{ product.description }}</p>
          <p class="card-text">
            <strong>Price:</strong> {{ product.price ? (product.price | currency:'USD') : 'N/A' }}
          </p>
          <p class="card-text">
            <strong>Stock:</strong> {{ product.stock }}
          </p>
          <p class="card-text">
            <small class="text-muted">
              Created: {{ product.createdAt | date:'medium' }}
            </small>
          </p>

          <!-- Botones -->
          <div class="mt-4">
            <a routerLink="/" class="btn btn-outline-secondary me-2">Back to List</a>

            <ng-container *ngIf="authService.isAdmin()">
              <a [routerLink]="['/products', product.id, 'edit']" class="btn btn-warning me-2">Edit</a>
              <button (click)="deleteProduct(product.id)" class="btn btn-danger">Delete</button>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
