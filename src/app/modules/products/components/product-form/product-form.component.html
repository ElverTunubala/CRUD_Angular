<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          <h3>{{ isEdit ? 'Edit Product' : 'Add New Product' }}</h3>
        </div>
        <div class="card-body">
          <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="name" class="form-label">Product Name</label>
              <input type="text" class="form-control" id="name" formControlName="name"
                     [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
              <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
                <div *ngIf="f['name'].errors?.['required']">Name is required</div>
              </div>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea class="form-control" id="description" formControlName="description"
                        [ngClass]="{ 'is-invalid': submitted && f['description'].errors }" rows="3"></textarea>
              <div *ngIf="submitted && f['description'].errors" class="invalid-feedback">
                <div *ngIf="f['description'].errors?.['required']">Description is required</div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="price" class="form-label">Price</label>
                <input type="number" class="form-control" id="price" formControlName="price"
                       [ngClass]="{ 'is-invalid': submitted && f['price'].errors }" step="0.01">
                <div *ngIf="submitted && f['price'].errors" class="invalid-feedback">
                  <div *ngIf="f['price'].errors?.['required']">Price is required</div>
                  <div *ngIf="f['price'].errors?.['min']">Price must be positive</div>
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label for="stock" class="form-label">Stock</label>
                <input type="number" class="form-control" id="stock" formControlName="stock"
                       [ngClass]="{ 'is-invalid': submitted && f['stock'].errors }">
                <div *ngIf="submitted && f['stock'].errors" class="invalid-feedback">
                  <div *ngIf="f['stock'].errors?.['required']">Stock is required</div>
                  <div *ngIf="f['stock'].errors?.['min']">Stock must be positive</div>
                </div>
              </div>
            </div>

            <div class="mb-3">
              <label for="image" class="form-label">Image URL (optional)</label>
              <input type="text" class="form-control" id="image" formControlName="image">
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
              <button type="button" class="btn btn-secondary me-md-2" (click)="router.navigate(['/products'])">Cancel</button>
              <button type="submit" class="btn btn-primary" [disabled]="isLoading">
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm"></span>
                {{ isEdit ? 'Update' : 'Save' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
